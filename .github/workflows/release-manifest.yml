name: Release manifest
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (empty selects latest stable)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tool -p test_release_manifest.py
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Publish exact release inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/releases/latest"
          if [[ -n "$RELEASE_TAG" ]]; then endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"; fi
          gh api "$endpoint" > "$RUNNER_TEMP/release.json"
          python3 tool/release_manifest.py build --repository "$GITHUB_REPOSITORY" --input "$RUNNER_TEMP/release.json" --output "$RUNNER_TEMP/release-manifest.json"
          manifest_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$RUNNER_TEMP/release-manifest.json")"
          gh release upload "$manifest_tag" "$RUNNER_TEMP/release-manifest.json" --clobber --repo "$GITHUB_REPOSITORY"
