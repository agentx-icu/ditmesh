name: ditmesh_chat
description: >-
  Tim2Tox-backed implementation of the ditmesh_chat_api contract (identity,
  friends, conversations, messages, groups over the Tox P2P network). The ONLY
  package in the workspace allowed to import tim2tox_dart / the Tencent Cloud
  Chat SDK (enforced by tool/import_guard.dart).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  ditmesh_chat_api: ^0.1.0
  # Path dependency on the git submodule. tim2tox_dart itself depends on
  # `tencent_cloud_chat_sdk: any`, which the ROOT pubspec_overrides.yaml
  # (generated by tool/bootstrap_deps.dart) pins to the vendored, patched SDK.
  tim2tox_dart:
    path: ../../third_party/tim2tox/dart
  # Only for `setNativeLibraryName` (patched SDK export) and the Dart* group
  # bindings that Tim2Tox still routes through the Tencent adapter.
  tencent_cloud_chat_sdk: any
  crypto: ^3.0.3
  ffi: ^2.1.0
  # 11.x: its Windows plugin depends on win32 ^6, the same major apps/ditmesh's
  # share_plus needs; 9.x/10.x pin win32 ^5 and make the workspace unsolvable.
  flutter_secure_storage: ^11.0.0
  meta: ^1.16.0
  path: ^1.8.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
